# 族谱管理系统 Docker Compose 部署配置
#
# 快速启动（H2 文件库，不用装 MySQL，适合试用/小规模使用；redis 仍是必需的，见下）：
#   docker compose --profile h2 up -d
#   注意这套仍然会起 redis 容器 —— 会话与登录锁定计数都存 Redis（依赖
#   spring-boot-starter-session-data-redis + LoginAttemptService 的 StringRedisTemplate），
#   只换数据库不换 redis；实测（2026-11-22）没有 redis 时应用照样启动、/actuator/health 照样 200
#   （Lettuce 懒连接），但登录会先卡约 60s 再返回 {"code":500,"message":"系统内部错误"}（HTTP 仍 200）。
#
# 生产部署（MySQL 专属容器，不再依赖任何共享库）：
#   1. 复制 .env.example 为 .env 并填写数据库凭据
#   2. 本地镜像部署时设置 FT_IMAGE=family-tree:vNN-local
#   3. docker compose --profile mysql up -d
#
# 两套模式选哪套由「各服务硬编码的 SPRING_PROFILES_ACTIVE」决定（h2 / mysql），
# 不再读 .env 里的同名变量 —— 以前 h2 模式默认落到 prod，而 prod 的数据源是 MySQL，
# 于是「H2 快速启动」其实从没走过 H2。数据源定义分别在 application-h2.yml 与 application-mysql.yml。
#
# 版本管理：
#   在 .env 中设置 IMAGE_TAG 锁定版本（如 1.0.0），不设置则使用 latest
#   回滚：修改 IMAGE_TAG 为上一版本号，docker compose --profile <h2|mysql> up -d 即可
#   （不带 --profile 时两个应用服务都不在启用集合里，命令会什么都不做；deploy/scripts/rollback.sh
#    已按 FT_COMPOSE_PROFILE/COMPOSE_PROFILES 处理，默认 mysql）

services:
  # ========== H2 模式（--profile h2 激活） ==========
  family-tree:
    image: ${FT_IMAGE:-ghcr.io/mouhinu/family-tree:${IMAGE_TAG:-latest}}
    container_name: family-tree
    restart: unless-stopped
    profiles:
      - h2
    depends_on:
      # redis 服务同时挂在 h2 与 mysql 两个 profile 下：会话外置去不掉，见文件头
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8090"
    volumes:
      - family-tree-data:/app/data
      - family-tree-logs:/app/logs
    environment:
      # 硬编码而不是 ${SPRING_PROFILES_ACTIVE:-prod}：prod 的数据源是 MySQL，
      # 而 compose 里没有供它连的地址，以前这套「H2 快速启动」实际起的是 MySQL 配置
      - SPRING_PROFILES_ACTIVE=h2
      # 容器内的 redis 走服务名，别让它退化成基配置的 localhost:6381（那是宿主映射口径）
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # H2 库文件落在 family-tree-data 卷里（{path}.mv.db / {path}.trace.db），换镜像不丢数据
      - H2_DATA_PATH=/app/data/family_tree
      # 平台管理员白名单（逗号分隔的登录用户名，与家族角色无关；为空则 /api/admin 全部拒绝）
      - PLATFORM_ADMIN_USERNAMES=${PLATFORM_ADMIN_USERNAMES:-}
      # 家族相册根目录：必须落在 /app/data 卷内，实际布局 {dir}/{familyId}/{userId}_{uuid}.{ext}
      - FAMILY_TREE_PHOTO_DIR=${FAMILY_TREE_PHOTO_DIR:-/app/data/photos}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    # 运行时为 distroless 镜像（无 curl），本服务不声明 healthcheck，存活由 sidecar 探测日志判定
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  # 健康检查 sidecar（distroless 镜像无 curl，通过 network_mode:service 共享网络栈）
  family-tree-healthcheck:
    image: alpine/curl:8.9.1
    container_name: family-tree-healthcheck
    network_mode: "service:family-tree"
    restart: unless-stopped
    profiles:
      - h2
    depends_on:
      family-tree:
        condition: service_started
    entrypoint: [ "sh", "-c", "while true; do sleep 30; curl -sf http://localhost:8090/actuator/health > /dev/null || echo '[healthcheck] FAILED'; done" ]

  # ========== MySQL 模式（--profile mysql 激活） ==========
  mysql:
    image: mysql:8.0
    container_name: family-tree-mysql
    restart: unless-stopped
    profiles:
      - mysql
    # 仅回环暴露，供宿主机备份/调试，不对局域网开放
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-family_tree}
      - MYSQL_USER=${DB_USERNAME:-family_tree_app}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    # 8GB 宿主防内存回收事故：显式上限
    mem_limit: ${MYSQL_MEM_LIMIT:-1024m}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:8.8.0
    container_name: family-tree-redis
    restart: unless-stopped
    profiles:
      # 两种数据库形态都要它：Spring Session 与 LoginAttemptService 都直连 Redis
      - h2
      - mysql
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL 模式下的应用服务（覆盖上面的默认服务）
  family-tree-mysql:
    image: ${FT_IMAGE:-ghcr.io/mouhinu/family-tree:${IMAGE_TAG:-latest}}
    container_name: family-tree-app
    restart: unless-stopped
    profiles:
      - mysql
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8090"
    # 沿用历史裸 docker run 的宿主目录，照片/日志原位不动
    volumes:
      - ./docker-data:/app/data
      - ./docker-logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-family_tree}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - DB_USERNAME=${DB_USERNAME:-family_tree_app}
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis 走 compose 网络内服务名，不再依赖宿主端口/共享实例
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # 平台管理员白名单（逗号分隔的登录用户名，与家族角色无关；为空则 /api/admin 全部拒绝）
      - PLATFORM_ADMIN_USERNAMES=${PLATFORM_ADMIN_USERNAMES:-}
      # 家族相册根目录：必须落在 /app/data 卷内，实际布局 {dir}/{familyId}/{userId}_{uuid}.{ext}
      - FAMILY_TREE_PHOTO_DIR=${FAMILY_TREE_PHOTO_DIR:-/app/data/photos}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    # 运行时为 distroless 镜像（无 curl），本服务不声明 healthcheck，存活由 sidecar 探测日志判定
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  # MySQL 模式健康检查 sidecar
  family-tree-mysql-healthcheck:
    image: alpine/curl:8.9.1
    container_name: family-tree-mysql-healthcheck
    network_mode: "service:family-tree-mysql"
    restart: unless-stopped
    profiles:
      - mysql
    depends_on:
      family-tree-mysql:
        condition: service_started
    entrypoint: [ "sh", "-c", "while true; do sleep 30; curl -sf http://localhost:8090/actuator/health > /dev/null || echo '[healthcheck] FAILED'; done" ]

  # ========== Prometheus 监控（--profile monitoring 激活） ==========
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: family-tree-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  # ========== Grafana 可视化（--profile monitoring 激活） ==========
  grafana:
    image: grafana/grafana:11.1.0
    container_name: family-tree-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/family-tree.yml:ro
      - ./deploy/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/family-tree.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  family-tree-data:
  family-tree-logs:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
