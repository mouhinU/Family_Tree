apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-tree-app-blue
  namespace: prod
  labels:
    app: family-tree-blue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: family-tree-blue
  template:
    metadata:
      labels:
        app: family-tree-blue
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: family-tree-app
          image: docker.io/library/family-tree:v95-local
          imagePullPolicy: Never
          ports:
            - containerPort: 8091
          env:
            - name: SERVER_PORT
              value: "8091"
          envFrom:
            - secretRef:
                name: ft-app-env
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 40
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: photos
              mountPath: /app/data/photos
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: photos
          hostPath:
            path: /opt/family-tree/data/photos
            type: Directory
        - name: logs
          hostPath:
            path: /opt/family-tree/logs
            type: Directory
