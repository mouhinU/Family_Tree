# 族谱管理系统 — ECS 反代（两个 server 块：IP 明文 HTTP 可用 + 域名 HTTPS 已配待备案）
#
# 为什么单独一份：deploy/nginx/family-tree.conf 是「域名 80 全量 301 到 443」的模板，
# 而当前 ECS 的实际对外形态是公网 IP 明文 HTTP —— 自有域名的备案接入商还不是阿里云
# （或未做网站备案，需在工信部/备案控制台确认），阿里云网关会对该域名的 80 和 443 一并
# 返回 403「Non-compliance ICP Filing」；裸 IP 又签不到可信证书。所以本文件让 IP 访问
# 先活着，把域名 + 证书作为第二个 server 块备好，备案一通过只补一条 301 就能切完。
#
# 用法：cp nginx-family-tree.conf /etc/nginx/conf.d/family-tree.conf && nginx -t && systemctl reload nginx
#       （./ecs-setup.sh nginx 做的就是这一件事 + 摘 default_server，它会用仓库版整体覆盖线上那份，
#        所以重跑前必须先放好下面 443 块引用的两个证书文件，否则 nginx -t 直接失败、reload 不执行。）
# 注意：本文件里写了 default_server，需同时摘掉 /etc/nginx/nginx.conf 中 stock server 块的
#       default_server 标记，否则请求会命中 nginx 自带的默认页。ecs-setup.sh 的 nginx 阶段已处理。
# 证书两个文件不在仓库里，需先 mkdir -m 700 -p /etc/nginx/ssl 再放进去（nginx 不会自己建目录），见下面 443 块的注释。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 与 Spring SecurityHeadersFilter 互补。故意不加 HSTS：当前是明文 HTTP，
    # 一旦下发 HSTS 会把浏览器锁在 https 上，而 IP 访问根本没有可用证书。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Actuator 只允许本机与内网段读取，公网访问返回 403
    location /actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /h2-console {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级头：v71 会话走 Spring Session + Redis，当前没有 WS 端点，
        # 这里与 deploy/nginx/family-tree.conf 保持一致，将来接入时不用再改反代
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================================================
# 域名 + HTTPS（msjzp.xyz / www.msjzp.xyz）
# ============================================================================
#
# 状态说明（2026-11-22 实测更新）：证书已装好、443 已监听，本块在实例内验证通过；
# 但备案接入阿里云之前它对家人不可用 —— 而且拦截方式比原先以为的更粗：
#   · 实例内（有效手段）：curl -sk --resolve msjzp.xyz:443:127.0.0.1 https://msjzp.xyz/ → 200；
#     openssl s_client -connect 127.0.0.1:443 -servername msjzp.xyz 下发 leaf + DigiCert 中间证书两段，
#     用系统根证书库验证 Verify return code: 0 (ok)，协商到 TLSv1.3。
#   · 从公网：任何带 SNI 的 TLS ClientHello 到 <公网IP>:443 都在握手中途被掐断（curl 报
#     SSL_ERROR_SYSCALL），与 SNI 内容无关 —— 拿 probe.example.org 做对照同样断；不带 SNI 的
#     TLS 直连 IP 反倒正常出 200（证明包确实到了 nginx），nc -z 也通（TCP 层没被挡）。
#     域名的明文 HTTP 则走网关，返回 403「Non-compliance ICP Filing」(Server: Beaver)。
#   所以别再用「握手成功 + 网关 403」当作自测通过的判据（实测看不到这个组合），也别据此判断
#   安全组状态：安全组已放行 TCP 443（2026-11-22），外层那刀是在 ClientHello 之后按 SNI 落的。
#   结论：nginx + 证书这侧已验证正确，端到端只能等备案生效后用 https://msjzp.xyz/ 直接验。
#
# 故意不做两件事，备案通过后再补：
#   1. 不加 80 → 443 的 301 —— 备案没下来时 https://域名 不可达，加了跳转会把现在能用的
#      IP 访问一起弄挂（IP 的 80 命中上面那个 default_server 块，本身没有 https 可跳）。
#   2. 不下发 HSTS —— max-age/includeSubDomains/preload 一旦进浏览器就回不到明文，
#      备案被驳回时等于自断退路。
# 也不开 ssl_stapling：要额外配 resolver 并让实例出网取 DigiCert OCSP，而备案前带 SNI 的请求
# 根本到不了这个 server 块，收益为零、只多一处 nginx -t warning。
#
# 证书来源：阿里云数字证书管理服务（免费 DV，DigiCert 签发），SAN 含 msjzp.xyz 与 www.msjzp.xyz。
# 有效期只到 2027-02-19（89 天），到期需在控制台重新验证下载并重传这两个文件；
# 想免掉这一步就改用实例上已有的 acme.sh 走 DNS-01（dns_ali）自动续签。
# 文件位置：/etc/nginx/ssl/msjzp.xyz.pem（证书+中间证书链，644）
#           /etc/nginx/ssl/msjzp.xyz.key（私钥，600，属主 root）—— 不进仓库、不进对话。
#           目录本身 drwx------ root；这两个文件名写死在上面的 ssl_certificate* 里，改名等于改配置。
# 注：leaf 的 CN 是 www.msjzp.xyz，但 SAN 含 msjzp.xyz 与 www.msjzp.xyz —— 现代浏览器/客户端按
#     SAN 匹配，两个名字都算命中，不用为此重签。
#
# 注意：下面这些 location 与上面 80 端口那块是重复的，nginx 没有跨 server 继承。
# 改一处要同时改另一处（尤其是 client_max_body_size 和超时），否则域名与 IP 行为不一致。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name msjzp.xyz www.msjzp.xyz;

    ssl_certificate     /etc/nginx/ssl/msjzp.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/msjzp.xyz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /h2-console {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme 在本 server 块恒为 https；将来切 prod profile（cookie.secure=true）要靠它
        # 让 Spring 判定安全连接
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
