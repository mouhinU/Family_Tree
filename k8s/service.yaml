apiVersion: v1
kind: Service
metadata:
  name: family-tree
  namespace: prod
spec:
  type: NodePort
  selector:
    # 蓝绿切流即 patch 此 selector：app=family-tree-blue ↔ app=family-tree-green（见 README「零停机发版」）
    app: family-tree-blue
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30090
