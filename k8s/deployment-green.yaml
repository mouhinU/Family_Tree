# 绿槽（blue/green 的 green）：零停机发版专用。label 与蓝槽（deployment-blue.yaml, app=family-tree-blue）区分，
# Service selector 指向哪边哪边接流量；平时保持 replicas 0，发版时 scale 1 做隔离预检。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-tree-app-green
  namespace: prod
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: family-tree-green
  template:
    metadata:
      labels:
        app: family-tree-green
    spec:
      containers:
        - name: family-tree-app
          # 发版时更新此 tag（蓝绿两槽交替使用，见 README「零停机发版」）
          image: family-tree:v74-local
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: family-tree-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: family-tree-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # distroless 无 shell，探针只能 httpGet；启动可长达 3.5min
          startupProbe:
            httpGet:
              path: /login.html
              port: 8090
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login.html
              port: 8090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login.html
              port: 8090
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: family-tree-data
        - name: logs
          persistentVolumeClaim:
            claimName: family-tree-logs
