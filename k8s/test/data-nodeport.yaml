# test 数据层 NodePort（宿主机按需起 socat：8091/3309/6382，见 README test 章节）
apiVersion: v1
kind: Service
metadata:
  name: mysql-nodeport
  namespace: test
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - port: 3309
      targetPort: 3306
      nodePort: 30309
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport
  namespace: test
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - port: 6382
      targetPort: 6379
      nodePort: 30382
