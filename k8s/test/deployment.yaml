# test 应用（按需拉起：默认 replicas 0；跑回归前 scale --replicas=1，用完缩回 0）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-tree-app
  namespace: test
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: family-tree
  template:
    metadata:
      labels:
        app: family-tree
    spec:
      containers:
        - name: family-tree-app
          # 拉起 test 前按需改成目标镜像 tag（构建规则同 prod：vNN-local）
          image: family-tree:v70-local
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: family-tree-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: family-tree-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # distroless 无 shell，探针只能 httpGet；启动可长达 3.5min
          startupProbe:
            httpGet:
              path: /login.html
              port: 8090
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login.html
              port: 8090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login.html
              port: 8090
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: family-tree-data
        - name: logs
          persistentVolumeClaim:
            claimName: family-tree-logs
