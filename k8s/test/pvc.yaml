# test 环境 PVC（claim 名与 prod 一致，namespace 隔离；比 prod 各缩一半）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: family-tree-data
  namespace: test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: family-tree-logs
  namespace: test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
