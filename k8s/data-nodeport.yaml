# 宿主机兼容层：把集群内 mysql/redis 经 NodePort 暴露，配合 alpine/socat 代理重发布 127.0.0.1:3308/6381
# （保持 .env、备份脚本、scratch 克隆工具原有的 host:3308/6381 用法不变）
apiVersion: v1
kind: Service
metadata:
  name: mysql-nodeport
  namespace: prod
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - port: 3308
      targetPort: 3306
      nodePort: 30308
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport
  namespace: prod
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - port: 6381
      targetPort: 6379
      nodePort: 30381
