# H2 开发环境配置（默认）
spring:
  datasource:
    url: jdbc:h2:file:./data/family-tree;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
