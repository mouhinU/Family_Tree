server:
  port: 8090

spring:
  application:
    name: family-tree

  profiles:
    active: mysql

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Spring AI（OpenAI 兼容协议，默认对接 DeepSeek，可切换任意兼容服务）
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:deepseek-chat}
        temperature: 0.7
        max-tokens: 4096

  # Redis 分布式缓存（Docker 容器，端口 6380）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.mouhin.family.tree: debug

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # Redis 缓存统计
  cache:
    cache-names: familyTreeCache

# AI 功能开关（模型接入参数见 spring.ai.openai）
ai:
  llm:
    enabled: false

# 平台（系统）管理员白名单：逗号分隔的登录用户名，与家族角色无关
# 生产环境通过环境变量 PLATFORM_ADMIN_USERNAMES 注入，修改后需重启生效
family-tree:
  platform:
    admin-usernames: ${PLATFORM_ADMIN_USERNAMES:}
  # 家族相册根目录，实际布局 {dir}/{familyId}/{userId}_{uuid}.{ext}（按家族分目录隔离）
  # 生产容器必须用环境变量指到挂载卷内（/app/data 是 family-tree-data 卷），
  # 否则相对路径会随工作目录漂移，重启即丢
  photo:
    dir: ${FAMILY_TREE_PHOTO_DIR:./data/photos}
