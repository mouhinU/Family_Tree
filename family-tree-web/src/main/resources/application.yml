server:
  port: 8090

spring:
  application:
    name: family-tree

  profiles:
    active: dev

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Spring AI（OpenAI 兼容协议，默认对接 DeepSeek，可切换任意兼容服务）
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:deepseek-chat}
        temperature: 0.7
        max-tokens: 4096

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.mouhin.family.tree: debug

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # Caffeine 缓存统计（需在代码中为 Cache 注册 metrics）
  cache:
    cache-names: familyTreeCache

# AI 功能开关（模型接入参数见 spring.ai.openai）
ai:
  llm:
    enabled: false
