server:
  port: 8090

spring:
  application:
    name: family-tree

  profiles:
    active: mysql

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Spring AI（OpenAI 兼容协议，默认对接 DeepSeek，可切换任意兼容服务）
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:deepseek-chat}
        temperature: 0.7
        max-tokens: 4096

  # 会话外置 Redis（Spring Session）：多实例/蓝绿切流登录态不丢；30m 与切换前 Tomcat 默认一致
  session:
    timeout: 30m

  # Redis 分布式缓存（family-tree 专属容器 family-tree-redis，宿主映射 127.0.0.1:6381；compose 内走服务名 redis:6379）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 显式超时：默认命令超时 60s，Redis 黑洞时单个登录请求会占住线程 >45s（实测），
      # 线程池被拖满后整站不可用；收紧到 500ms 让降级路径秒级生效（本机回环 O(1) 命令足够宽裕）
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.mouhin.family.tree: debug

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # Redis 缓存统计
  cache:
    cache-names: familyTreeCache

# AI 功能开关（模型接入参数见 spring.ai.openai）
ai:
  llm:
    enabled: false

# 阿里云短信认证服务（Dypnsapi，SendSmsVerifyCode 验证码短信）：enabled=false 或未配置时走日志模式，
# 验证码仅落 INFO 日志（本地开发/端到端测试可用）。凭据、签名与模板全部经环境变量注入，
# Secret 不入库不落日志；SignName/TemplateCode 须为短信认证服务赠送组合（恒创联众 / 100001），
# 验证码由服务端生成并经 Redis 自校验（自定义码模式，阿里云侧不核验）
aliyun:
  sms:
    enabled: ${ALIYUN_SMS_ENABLED:false}
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    endpoint: ${ALIYUN_SMS_ENDPOINT:dypnsapi.aliyuncs.com}

# 平台（系统）管理员白名单：逗号分隔的登录用户名，与家族角色无关
# 生产环境通过环境变量 PLATFORM_ADMIN_USERNAMES 注入，修改后需重启生效
family-tree:
  platform:
    admin-usernames: ${PLATFORM_ADMIN_USERNAMES:}
  # 家族相册根目录，实际布局 {dir}/{familyId}/{userId}_{uuid}.{ext}（按家族分目录隔离）
  # 生产容器必须用环境变量指到挂载卷内（/app/data 是 family-tree-data 卷），
  # 否则相对路径会随工作目录漂移，重启即丢
  photo:
    dir: ${FAMILY_TREE_PHOTO_DIR:./data/photos}
