server:
  port: 8090

spring:
  application:
    name: family-tree

  profiles:
    active: mysql

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Spring AI（OpenAI 兼容协议，默认对接 DeepSeek，可切换任意兼容服务）
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:deepseek-chat}
        temperature: 0.7
        max-tokens: 4096

  # Redis 分布式缓存（Docker 容器，端口 6380）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.mouhin.family.tree: debug

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # Redis 缓存统计
  cache:
    cache-names: familyTreeCache

# AI 功能开关（模型接入参数见 spring.ai.openai）
ai:
  llm:
    enabled: false
