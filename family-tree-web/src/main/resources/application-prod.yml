# 生产环境配置（MySQL + 安全加固）
# 凭据通过环境变量注入，切勿在本文或 .env 中硬编码真实密码。

server:
  # 反向代理场景下确保正确解析 X-Forwarded-* 头
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/family_tree?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:family_tree_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # 生产环境禁用 H2 Console
  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true

# 生产日志由 logback-spring.xml prod profile 控制
logging:
  level:
    com.mouhin.family.tree: warn

# Actuator 生产安全：仅暴露 health + info，metrics/prometheus 需认证
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  cache:
    cache-names: familyTreeCache
