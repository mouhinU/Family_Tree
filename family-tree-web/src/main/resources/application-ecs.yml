# 阿里云 ECS 单机部署配置（配合 deploy/ecs/ 使用）
#
# 激活方式：SPRING_PROFILES_ACTIVE=mysql,ecs —— 后激活的 profile 覆盖前者。
# mysql 负责数据源与 Flyway，本文件只管两件事：对外形态（nginx 反代 + 明文 HTTP）
# 与 2GiB 小机型的资源配额。
# 数据源是可换的：把 mysql 换成 h2（见 application-h2.yml）时本文件照用 —— 这里没有一行
# MySQL 专属，hikari 那几个键对 H2 文件库同样有效（池子小对嵌入式库只有好处）。
#
# 为什么不用 prod：application-prod.yml 的 cookie.secure=true 会让浏览器在明文 HTTP 下
# 干脆不回传 SESSION Cookie —— 表现是「登录返回成功，下一个请求就变成未登录」。
# 实测（v71 镜像 + 同一账号，同一台机器）：
#   mysql,prod → Set-Cookie: SESSION=...; Path=/; Secure; HttpOnly; SameSite=Strict
#   mysql,ecs  → Set-Cookie: SESSION=...; Path=/; HttpOnly; SameSite=Lax
# 上 HTTPS 之后改回 prod（或把下面两行改成 true/strict）。反代不用换文件：
# deploy/ecs/nginx-family-tree.conf 已带域名 443 块，只需补 80→443 的 301 与 HSTS。

server:
  # 前置 nginx 是唯一入口（应用端口只绑 127.0.0.1），必须信任 X-Forwarded-*，
  # 否则日志与限流里的来源地址全是 127.0.0.1，request.isSecure() 也永远为 false
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        # 这三行都会透传给 Spring Session 的 DefaultCookieSerializer，是真生效的
        http-only: true
        secure: false
        # lax 而非 strict：家人从微信/短信链接点进来属于跨站首跳，strict 下该请求不带会话 Cookie
        # 状态变更仍有 CsrfFilter 的 Synchronizer Token 兜底（POST/PUT/DELETE 全查），降 lax 不放开 CSRF 面
        same-site: lax

  tomcat:
    # 默认 200 工作线程、每线程约 1MiB 栈；容器上限 768Mi 时按 50 足够，
    # 剩余并发交给 accept-count 排队，避免线程栈把堆外内存吃掉
    threads:
      max: 50
    accept-count: 100
    max-connections: 200

spring:
  datasource:
    hikari:
      # mysql 侧 --max-connections=100，单应用实例不需要更大的池；池越小堆外与 DB 内存越省
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # H2 Console 双保险：compose 里没有 H2 数据路径，nginx 也 deny，这里再关一次
  h2:
    console:
      enabled: false

# 单机小站要能查问题，不用 prod 的 warn；输出目标由 logback-spring.xml 决定：
# mysql 块写文件，ecs 块额外加 CONSOLE（docker logs 才有东西看）
logging:
  level:
    com.mouhin.family.tree: info
