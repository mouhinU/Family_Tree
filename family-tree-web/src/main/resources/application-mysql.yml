# MySQL 生产环境配置
# 凭据不入库：通过环境变量注入（DB_URL / DB_USERNAME / DB_PASSWORD）。
# compose 部署时由 docker-compose.yml 注入服务名地址（mysql:3306）与 .env 中的口令，本文件默认值不生效。
# 宿主机直跑（mvn spring-boot:run -Dspring-boot.run.profiles=mysql）时默认值指向
# family-tree 专属 MySQL 容器 family-tree-mysql（宿主映射 127.0.0.1:3308），
# 口令取自仓库根目录 .env 的 DB_PASSWORD（family_tree_app 为最小权限应用账号，勿使用 root）。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/family_tree?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:family_tree_app}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
