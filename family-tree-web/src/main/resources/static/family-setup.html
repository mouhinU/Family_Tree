<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>族谱管理系统 - 加入家族</title>
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .family-setup-body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }
        .family-setup-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .family-setup-card h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }
        .family-setup-card .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .setup-section {
            margin-bottom: 28px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
        }
        .setup-section h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #333;
        }
        .setup-section p {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: #666;
        }
        .setup-section input, .setup-section select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
            background: #fff;
        }
        .setup-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .setup-section .section-tip {
            margin: 12px 0 8px 0;
            padding-top: 12px;
            border-top: 1px dashed #e8e8e8;
        }
        .setup-section button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            background: #4A90D9;
        }
        .setup-section button:hover {
            background: #3a7bc8;
        }
        .setup-section .btn-secondary {
            background: #6c757d;
        }
        .setup-section .btn-secondary:hover {
            background: #5a6268;
        }
        #setup-message {
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        #setup-message.error {
            display: block;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
        }
        #setup-message.success {
            display: block;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #389e0d;
        }
    </style>
</head>
<body class="family-setup-body">
<div class="family-setup-card">
    <h1>族谱管理系统</h1>
    <p class="subtitle">您尚未加入任何家族，请创建或加入一个家族</p>

    <div class="setup-section">
        <h3>创建新家族</h3>
        <p>输入家族名称，创建一个新的家族并成为族长。</p>
        <input id="create-name" placeholder="例如：张氏家族" type="text">
        <p class="section-tip">选填：创建时把您的信息写成家族第一个族谱节点，并标记为「我的位置」。辈分（世代名称）可稍后在族谱里补录。</p>
        <label for="init-name">初始节点姓名</label>
        <input id="init-name" maxlength="50" placeholder="您的姓名" type="text">
        <label for="init-gender">性别</label>
        <select id="init-gender">
            <option value="">不设置</option>
            <option value="1">男</option>
            <option value="2">女</option>
        </select>
        <label for="init-birth">出生日期</label>
        <div id="init-birth-field"></div>
        <button id="btn-create" type="button">创建家族</button>
    </div>

    <div class="setup-section">
        <h3>加入已有家族</h3>
        <p>输入族长分享给您的邀请码，加入该家族。</p>
        <input id="join-code" placeholder="请输入邀请码" style="text-transform: uppercase;" type="text">
        <button class="btn-secondary" id="btn-join" type="button">加入家族</button>
    </div>

    <div id="setup-message"></div>
</div>

<script src="/js/ft/core.js?v=20261120b"></script>
<script src="/js/lib/lunar.js?v=20261114a"></script>
<script src="/js/ft/birth-calendar.js?v=20261119a"></script>
<script src="/js/ft/family-setup.js?v=20261119a"></script>
</body>
</html>
