<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>族谱管理系统 - 登录</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="login-body">
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">族谱管理系统</h1>
        <p class="login-subtitle">Family Tree Manager</p>

        <div class="login-tabs">
            <button class="tab-btn active" id="tab-login">登录</button>
            <button class="tab-btn" id="tab-register">注册</button>
        </div>

        <!-- 登录表单 -->
        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="login-username">用户名 / 手机号 / 邮箱</label>
                <input id="login-username" name="username" placeholder="请输入用户名、手机号或邮箱" required type="text"
                       autocomplete="username">
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <input id="login-password" name="password" placeholder="请输入密码" required type="password">
            </div>
            <button class="btn-primary" type="submit">登 录</button>
        </form>

        <div class="login-mode-toggle" id="login-mode-toggle" style="text-align:center;margin:8px 0 0;">
            <a href="javascript:void(0)" id="switch-login-mode" style="font-size:13px;color:#666;">短信验证码登录</a>
        </div>

        <!-- 短信验证码登录表单 -->
        <form class="login-form" id="sms-login-form" style="display:none;">
            <div class="form-group">
                <label for="sms-phone">手机号</label>
                <input id="sms-phone" maxlength="11" name="phone" placeholder="11位大陆手机号" required
                       type="tel" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="sms-code">短信验证码</label>
                <div style="display:flex;gap:8px;">
                    <input id="sms-code" maxlength="6" name="code" placeholder="6位短信验证码" required
                           type="text" inputmode="numeric" style="flex:1;">
                    <button class="btn-sms-send" id="btn-sms-login-send" type="button"
                            style="flex-shrink:0;white-space:nowrap;padding:0 14px;border:none;border-radius:4px;background:var(--cinnabar);color:#f7f1e0;font-size:14px;font-family:var(--font-kai);cursor:pointer;">发送验证码</button>
                </div>
            </div>
            <button class="btn-primary" type="submit">登 录</button>
        </form>

        <!-- 注册表单 -->
        <form class="login-form" id="register-form" style="display:none;">
            <div class="form-group">
                <label for="reg-username">用户名</label>
                <input id="reg-username" name="username" placeholder="请输入用户名" required type="text">
            </div>
            <div class="form-group">
                <label for="reg-password">密码</label>
                <input id="reg-password" minlength="6" name="password" placeholder="至少6位密码" required
                       type="password">
            </div>
            <div class="form-group">
                <label for="reg-email">邮箱 <span
                        style="color:#999;font-size:12px">（可选，可用于登录）</span></label>
                <input id="reg-email" maxlength="100" name="email" placeholder="请输入邮箱" type="email">
            </div>
            <div class="form-group">
                <label for="reg-phone">手机号 <span id="reg-phone-hint"
                        style="color:#999;font-size:12px">（可选，可用于登录）</span></label>
                <input id="reg-phone" maxlength="20" name="phone" placeholder="11位大陆手机号" type="tel">
            </div>
            <div class="form-group">
                <label for="reg-phone-code">短信验证码 <span id="reg-code-hint"
                        style="color:#999;font-size:12px">（开启短信验证注册时必填）</span></label>
                <div style="display:flex;gap:8px;">
                    <input id="reg-phone-code" maxlength="6" name="phoneCode" placeholder="6位短信验证码"
                           type="text" inputmode="numeric" style="flex:1;">
                    <button class="btn-sms-send" id="btn-sms-reg-send" type="button"
                            style="flex-shrink:0;white-space:nowrap;padding:0 14px;border:none;border-radius:4px;background:var(--cinnabar);color:#f7f1e0;font-size:14px;font-family:var(--font-kai);cursor:pointer;">发送验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-invite-code">家族邀请码 <span
                        style="color:#999;font-size:12px">（可选，加入已有家族）</span></label>
                <input id="reg-invite-code" name="inviteCode" placeholder="留空则注册后自行创建家族" style="text-transform:uppercase"
                       type="text">
            </div>
            <button class="btn-primary" type="submit">注 册</button>
        </form>

        <div class="message" id="login-message"></div>

        <!-- 首登强制改密（自动开通账号一次性初始口令） -->
        <form class="login-form" id="password-change-form" style="display:none;">
            <p class="login-subtitle" style="margin-bottom:16px;">为保障账号安全，首次登录须修改初始密码</p>
            <div class="form-group">
                <label for="change-new-password">新密码</label>
                <input id="change-new-password" minlength="6" name="newPassword" placeholder="至少6位密码" required
                       type="password" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="change-confirm-password">确认新密码</label>
                <input id="change-confirm-password" minlength="6" name="confirmPassword" placeholder="再次输入新密码"
                       required type="password" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="change-phone">手机号（选填，绑定后可用短信验证码登录）</label>
                <input id="change-phone" maxlength="11" name="phone" placeholder="11位大陆手机号"
                       type="tel" autocomplete="tel">
            </div>
            <button class="btn-primary" type="submit">修 改 密 码</button>
        </form>
    </div>
</div>

<script src="/js/ft/login.js?v=20261125a"></script>
</body>
</html>
