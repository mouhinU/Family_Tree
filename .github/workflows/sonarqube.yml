# SonarCloud 代码质量分析
# 使用 Maven SonarScanner 插件,项目标识配置在父 POM 的 properties 中
# 首次使用需在 GitHub 仓库 Settings > Secrets 中添加 SONAR_TOKEN
name: SonarCloud analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    name: SonarCloud 分析
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # SonarCloud 需要完整历史用于 blame 信息与增量分析
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x mvnw

      - name: 构建并分析
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 用于获取 PR 信息以装饰 PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
