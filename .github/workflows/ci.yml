# 持续集成：push 到 main 或 PR 时自动构建并运行单元测试
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x mvnw

      - name: 构建项目
        run: ./mvnw compile -B -q

      - name: 运行单元测试
        run: ./mvnw test -B
